<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enimsaj's PhotoBooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles/landing-page.css">
</head>

<body id="landing-page-body">
    <script>
    
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    if (/FBAN|FBAV|Messenger/i.test(ua)) {
        window.addEventListener('DOMContentLoaded', () => {
            const banner = document.createElement('div');
            banner.style.cssText = "background:#3E312C; color:white; padding:12px; text-align:center; font-family:Montserrat,sans-serif; font-size:12px; position:fixed; top:0; left:0; width:100%; z-index:99999; box-shadow:0 2px 5px rgba(0,0,0,0.2);";
            banner.innerHTML = `⚠️ <b>Please open in Chrome or Safari!</b> Tap the <b>three dots (...)</b> above and select "Open in Browser" to take photos and save properly.`;
            document.body.prepend(banner);
        });
    }
</script>
    <main id="landing-page">
        <h1 class="title-header">Enimsaj's</h1>
        <h2 class="title-header-2">PhotoBooth</h2>

        <a href="mood.html" class="photobooth-btn">
            <i class="fa-solid fa-camera"></i>
            START PHOTOBOOTH
        </a>
    </main>

</body>

</html>
